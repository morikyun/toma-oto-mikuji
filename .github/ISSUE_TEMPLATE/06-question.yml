name: 質問・相談したい
description: 音みくじの内容や使い方の質問。どのフォームを選ぶか迷ったときもこちら
title: '[質問・相談] '
type: Task
labels: ['質問・相談']
body:
  - type: markdown
    attributes:
      value: |
        分からないことや、まだまとまっていない相談も、いつもの言葉で教えてください。
        このフォームでは、**Type「Task（作業・対応）」**と**ラベル「質問・相談」**が自動で付きます。内容に合わせて、運営があとから分類できます。
        上の「タイトル」には、**「[質問・相談] 曲の解説に参考の配信を追加できるか相談したい」**のように短く書いてください。

        この内容と添付画像はインターネット上に公開されます。個人情報、パスワード・APIキー・トークン、非公開の資料やアーカイブ、歌詞・記事の全文は載せないでください。個人情報の取り扱いに関する相談は、サイトのプライバシーポリシーにあるお問い合わせフォームをご利用ください。
  - type: textarea
    id: question
    attributes:
      label: 質問・相談したいことを教えてください
      description: 分かる範囲だけで大丈夫です。どこから相談すればよいか迷っていることも書けます。
      placeholder: 例：ある曲についてとおまさんが話している公開配信を見つけました。曲の解説に追加してもらえますか？
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 関係する画面の名前・URL（任意）
      description: URLは画面上部に表示されるアドレスです。分からなければ空欄で大丈夫です。
      placeholder: 例：「誓い」の結果画面にある「この曲を、もう少し深く。」
  - type: textarea
    id: details
    attributes:
      label: 参考のURL・画像・補足（任意）
      description: 公開されている公式ページのURLや画面の画像があれば添えてください。画像には個人情報が写らないようにしてください。
  - type: markdown
    attributes:
      value: |
        入力できたら、画面下の **「Create（作成）」または「Submit new issue」** を押してください。
        登録後、運営がコメント欄でお返事します。
